services:
  pr-agent:
    image: pragent/pr-agent:0.35.0-github_app
    container_name: pr-agent-github
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./.pr_agent.toml:/app/pr_agent/settings/.secrets.toml:ro
    environment:
      LOG_LEVEL: "DEBUG"
      # GitHub — personal access token mode (no GitHub App registration needed)
      GITHUB__DEPLOYMENT_TYPE: "user"
      GITHUB_APP__OVERRIDE_DEPLOYMENT_TYPE: "false"

      # LM Studio running on host machine
      OPENAI__KEY: "lm-studio"
      OPENAI__API_KEY: "lm-studio"
      OPENAI__API_BASE: "http://host.docker.internal:1234/v1"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ngrok:
    image: ngrok/ngrok:latest
    container_name: pr-agent-ngrok
    restart: unless-stopped
    command: http pr-agent-github:3000 --log=stdout
    env_file:
      - .env
    ports:
      - "4040:4040"   # ngrok web UI → http://localhost:4040
    depends_on:
      - pr-agent
