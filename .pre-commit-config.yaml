minimum_pre_commit_version: "3.7.0"

repos:
  - repo: local
    hooks:
      # Quick quality checks (fast feedback) - run before each commit
      - id: verify-backend-lint
        name: verify-backend-lint
        entry: backend/scripts/verify-lint.sh
        language: system
        files: ^backend/
        pass_filenames: false
        stages: [pre-commit]

      - id: verify-backend-format
        name: verify-backend-format
        entry: backend/scripts/verify-format.sh
        language: system
        files: ^backend/
        pass_filenames: false
        stages: [pre-commit]

      - id: verify-backend-types
        name: verify-backend-types
        entry: backend/scripts/verify-types.sh
        language: system
        files: ^backend/
        pass_filenames: false
        stages: [pre-commit]

      # Full quality gate - run before push
      # Includes: lint, format, types, security, tests, dependency audit
      - id: verify-backend-all
        name: verify-backend-all
        entry: backend/scripts/verify-all.sh
        language: system
        pass_filenames: false
        stages: [pre-push]
